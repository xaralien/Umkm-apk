name: Build Sapa UMKM (APK + AAB)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK sudah terpasang di runner; setup-android@v3 dibuang
      # karena mencoba memasang paket 'tools' yang sudah dihapus Google.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android 36 platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Bootstrap Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Decode keystore (for signed release)
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/umkm.jks"

      - name: Build signed release AAB
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/umkm.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UMKM-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: UMKM-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/umkm.jks"
